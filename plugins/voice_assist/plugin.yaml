# What a screen gets when it takes this plugin: a wake word that runs on the screen itself, Home Assistant's Assist
# pipeline for everything after it, and two settings. The microphone and the media player are the screen's
# (ts_microphone, ts_media_player: the features this plugin needs), so nothing here owns a bus or a pin.

# Managed installs supply only the explicitly chosen models through Tessera's sidecar.
micro_wake_word:
  id: va_wake
  microphone:
    microphone: ts_microphone
    channels: 0
  stop_after_detection: false
  models: []
  vad:
    model: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/vad.json
  on_wake_word_detected:
    - if:
        condition:
          lambda: 'return id(va_plugin).accepts_wake_word(wake_word);'
        then:
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

# Home Assistant's Assist pipeline: what the screen hears goes to Home Assistant, the answer comes back on the screen's
# media player, which ducks music for it.
voice_assistant:
  id: va_assistant
  microphone:
    microphone: ts_microphone
    channels: 0
  media_player: ts_media_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_client_connected:
    - lambda: 'id(va_plugin).sync_wake();'
  on_client_disconnected:
    - lambda: 'id(va_assistant)->request_stop(); id(va_wake)->stop();'
  on_listening:
    - lambda: 'id(va_plugin).phase(esphome::voice_assist::Phase::LISTENING);'
  on_stt_vad_end:
    - lambda: 'id(va_plugin).phase(esphome::voice_assist::Phase::THINKING);'
  on_stt_end:
    - lambda: 'id(va_plugin).heard(x);'
  on_tts_start:
    - lambda: 'id(va_plugin).answer(x);'
  on_end:
    - lambda: 'id(va_plugin).phase(esphome::voice_assist::Phase::IDLE);'
  on_error:
    - lambda: 'id(va_plugin).failed(code, message);'

# The settings, kept on the screen and shown in Home Assistant, on the screen's settings page and in the editor.
switch:
  - platform: template
    id: va_wake_word
    name: "Wake word"
    icon: mdi:account-voice
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - lambda: 'id(va_plugin).sync_wake();'
    on_turn_off:
      - lambda: 'id(va_plugin).sync_wake();'
  # Its two sounds on the screen's speaker: when it starts to listen, and a plop again and again while Assist thinks.
  - platform: template
    id: va_wake_sound
    name: "Wake sound"
    icon: mdi:bell-ring
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    id: va_thinking_sound
    name: "Thinking sound"
    icon: mdi:timer-sand
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

select:
  - platform: voice_assist
    id: va_wake_phrase
    name: "Wake phrase"
    icon: mdi:chat-processing
    micro_wake_word_id: va_wake
    entity_category: config

voice_assist:
  id: va_plugin
  assistant: va_assistant
  wake_word: va_wake
  wake_word_on: va_wake_word
  wake_phrase: va_wake_phrase
  speaker: ts_speaker
  wake_sound_on: va_wake_sound
  thinking_sound_on: va_thinking_sound
