# Voice assistant: Home Assistant's own Assist on the screen. The screen listens for a wake word on its own (ESPHome's
# micro_wake_word), then hands what it hears to Home Assistant's Assist pipeline (ESPHome's voice_assistant) and plays
# the answer on its media player. Speech to text, the conversation agent and text to speech are whatever Home
# Assistant is set up with: its own, Whisper and Piper, OpenAI, Claude. It plays a sound when it starts to listen and a
# sound while Assist thinks (components/voice_assist/sounds). It needs a microphone, a speaker and a media player, which
# a board brings (features/audio.yaml) or a plugin.
id: voice_assist
version: 0.2.7
api: "0.8"
icon: robot
maintainer: MaxGramser
license: MIT
stage: beta
topics: [voice]
requires:
  esphome: 2026.9.0
  psram: true
  features: [microphone, speaker, media_player]
boards: any
flash_kb: 420

tiles:
  - id: assist
    name: tile_name
    icon: robot
    sizes: { min: 1x1, max: 4x2 }
    memory: 900
    example: tile_example

bar_items:
  - { id: busy, label: bar_busy, icon: robot, example: bar_example }

# The settings of plugin.yaml, also in the plugin's details on the screen's Plugins tab (their names as ids).
settings:
  - { key: wake_word, label: setting_wake_word, hint: setting_wake_word_hint }
  - { key: wake_phrase, label: setting_wake_phrase, hint: setting_wake_phrase_hint }
  - { key: wake_sound, label: setting_wake_sound, hint: setting_wake_sound_hint }
  - { key: thinking_sound, label: setting_thinking_sound, hint: setting_thinking_sound_hint }

# Catalogue entries are optional presets, not installed binaries.
build_settings:
  - id: wake_models
    kind: micro_wake_word_models
    label: build_wake_models
    hint: build_wake_models_hint
    target: va_wake
    feature_step_size: 10
    legacy_installed: [va_okay_nabu, va_hey_jarvis, va_hey_mycroft]
    catalogue:
      - id: va_okay_nabu
        label: model_okay_nabu
        url: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/okay_nabu.json
      - id: va_hey_jarvis
        label: model_hey_jarvis
        url: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/hey_jarvis.json
      - id: va_hey_mycroft
        label: model_hey_mycroft
        url: https://raw.githubusercontent.com/esphome/micro-wake-word-models/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2/hey_mycroft.json
